# תצורת הפריסה של Railway כקוד (מקור אמת אחד, נשמר בגיט).
# מתעד את מה שאחרת נקבע ידנית ב-UI ונשכח: פקודת המיגרציה, פקודת ההרצה,
# ובדיקת הבריאות. סודות אינם כאן לעולם — הם ב-Railway Variables.
#
# הבנאי: Dockerfile (31.8.2026). **קודם לכן היה Railpack, והוא נכשל בדבר
# אחד בדיוק:** `railpack.json` ביקש `postgresql-client`, ותמונת הבסיס נתנה
# את הגרסה שלה — 15 ואחר כך 17 — בעוד שירות ה-Postgres רץ על 18. `pg_dump`
# מסרב לגבות שרת חדש ממנו, ולכן **32 ג'ובי גיבוי נכשלו ברצף** בלי שגיבוי
# אחד הצליח. ל-`aptPackages` אין דרך להוסיף מאגר apt, ולכן אין דרך להגיע
# ל-18 דרך Railpack. הנימוק המלא והמחיר — בראש ה-`Dockerfile`.

[build]
builder = "DOCKERFILE"

[deploy]
# רץ פעם אחת לפני שהגרסה החדשה עולה לאוויר, בתמונת הריצה. כאן מוחלות
# המיגרציות שטרם הוחלו (`prisma migrate deploy` — אידמפוטנטי, בלי shadow DB).
# כשל כאן עוצר את הפריסה — וזה רצוי: עדיף לא לעלות מאשר לעלות מול סכימה ישנה.
preDeployCommand = ["npm run db:deploy"]

# `next start` בלי `-p` מאזין על משתנה הסביבה PORT ש-Railway מזריק (או 3000
# כברירת מחדל). לא להשתמש ב-`npm start` — הוא נעול לפורט 3100 של הפיתוח.
startCommand = "npm run start:prod"

# מסך ההתחברות ציבורי, מחזיר 200 בלי לגעת ב-DB, וכבר מכוסה ב-E2E. משמש
# כבדיקת בריאות: הוא מאשר שהשרת עלה ומגיש HTTP, לא רק שהפורט פתוח.
healthcheckPath = "/login"
healthcheckTimeout = 300

# הפעלה מחדש רק על כשל (לא בלולאה אינסופית). instance יחיד — התור והעובד
# רצים בתוך הפרוסס, ואין מצב של שני עובדים שמתנגשים על אותו ג'וב.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
